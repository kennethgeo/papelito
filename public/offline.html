<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#46245D"><title>Tu copia privada — Papelito</title><script src="/preferences.js" defer></script><style>
*{box-sizing:border-box}body{margin:0;background:#F8F5FB;color:#46245D;font:17px/1.5 system-ui,sans-serif;padding:24px}main{max-width:600px;margin:0 auto;border:1.5px solid #CEBED9;background:#FFFEFC;padding:30px 24px;box-shadow:5px 6px 0 #EDE5F5}img{width:65px;height:65px}h1{font-size:29px;line-height:1.1;letter-spacing:-1px}p{overflow-wrap:anywhere}button,input{width:100%;min-height:48px;font:inherit;margin-top:10px;border-radius:7px}button{background:#46245D;color:white;border:0;padding:10px;cursor:pointer}input{padding:10px;border:1px solid #7043A2}button:focus-visible,input:focus-visible{outline:3px solid #7043A2;outline-offset:3px}article{border-left:3px solid #F7D85B;padding-left:16px;margin:20px 0}a{color:#46245D}html[data-large-text=true] body{font-size:20px}
</style></head><body><main><img src="/icon-192.svg" alt="Papelito"><h1>Tu papelito, a mano.</h1><p>Esta pantalla abre únicamente la copia privada que hayas guardado en este dispositivo. No permite modificar datos ni consultar información nueva.</p><form id="unlock"><label for="local-key">Clave local de la copia</label><input id="local-key" type="password" autocomplete="off" minlength="8" maxlength="128" required><button>Abrir mi copia</button></form><p id="copy-status" role="status"></p><div id="private-content"></div><button id="lock">Bloquear copia</button><button id="remove">Eliminar copia local</button><button id="retry">Volver a Papelito con conexión</button></main><script type="module" src="/offline-reader.js"></script></body></html>
