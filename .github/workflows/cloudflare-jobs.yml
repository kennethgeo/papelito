name: Cloudflare scheduled jobs

# Manual deployment of the private cron Worker. It runs the same verification
# as CI first; the token is only exposed to the deploy step.
on:
  workflow_dispatch:
    inputs:
      activate:
        description: Activate cron only after Netlify schedules are confirmed off
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml

  deploy-jobs:
    name: Publicar tareas programadas
    needs: verify
    if: github.repository == 'kennethgeo/papelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: cloudflare-jobs
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: 2740f49f030ac787611fd720a5ab682a
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Deploy private cron Worker without schedules
        if: ${{ !inputs.activate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config cloudflare/scheduler.bootstrap.wrangler.jsonc
      - name: Activate cron after Netlify schedules are removed
        if: ${{ inputs.activate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare:jobs
