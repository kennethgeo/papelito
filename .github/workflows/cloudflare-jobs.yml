name: Cloudflare scheduled jobs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-jobs:
    if: github.repository == 'kennethgeo/papelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 2740f49f030ac787611fd720a5ab682a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Deploy cron Worker after Netlify schedules are removed
        run: npm run deploy:cloudflare:jobs
