name: Cloudflare production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-web:
    if: github.repository == 'kennethgeo/papelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 2740f49f030ac787611fd720a5ab682a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_APP_URL: https://papelitocr.papelitocr.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vinext
      - name: Deploy web Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:vinext
      - name: Missing token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: exit 1
