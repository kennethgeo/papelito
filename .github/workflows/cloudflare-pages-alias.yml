name: Cloudflare Pages short URL

on:
  push:
    branches: [main]
    paths:
      - cloudflare/pages-alias/**
      - .github/workflows/cloudflare-pages-alias.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-alias
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kennethgeo/papelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 2740f49f030ac787611fd720a5ab682a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx wrangler pages deploy --cwd cloudflare/pages-alias --project-name papelitocr --branch main
