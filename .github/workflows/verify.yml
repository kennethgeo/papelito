name: Verificación

# Reusable verification. It never receives secrets: callers must not pass
# `secrets: inherit`. Production deployments depend on this job succeeding.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Pruebas y compilaciones
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same public origin and build identifier as the production bundle.
      NEXT_PUBLIC_APP_URL: https://papelitocr.pages.dev
      PAPELITO_BUILD_ID: ${{ github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Draw algorithm unit tests
        run: npm run test:draw

      - name: Backend integration tests (PGlite PostgreSQL)
        run: npm run test:backend

      - name: Calendar, connection and Workers I/O tests
        run: npm run test:ux

      - name: Public-only PWA caching and update lifecycle
        run: npm run test:pwa

      - name: Four-person repository journey and snapshot privacy
        run: npm run test:journey

      - name: Dashboard data and next action
        run: npm run test:dashboard

      - name: Private messages, tastes, history and push delivery
        run: npm run test:social

      - name: Selected features, permissions, photos and offline encryption
        run: npm run test:selected

      - name: Attendance, waitlist and group rules privacy
        run: npm run test:organization

      - name: Lifecycle, deletion and retention integration tests
        run: npm run test:lifecycle

      - name: Audit fixes (sessions, errors, participants, limits)
        run: npm run test:hardening

      - name: Concurrency on a temporary real PostgreSQL (runner binaries)
        run: npm run test:concurrency

      - name: Next.js production build (without external secrets)
        run: npm run build

      - name: Workers bundle (vinext)
        run: npm run build:vinext

      - name: Workers deployment dry-run (no credentials)
        run: npm run deploy:vinext -- --dry-run

      - name: Scheduler dry-run, paused and active configurations
        run: |
          npx wrangler deploy --dry-run --config cloudflare/scheduler.bootstrap.wrangler.jsonc
          npm run check:cloudflare:jobs

      - name: Workers bundle served by workerd (routes, headers, failure states)
        run: npm run test:workerd

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser regression (next start)
        run: npm run test:e2e

      - name: Same browser suite on the Workers bundle (workerd, vinext router)
        run: npm run test:e2e:workerd

      - name: Keep browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
