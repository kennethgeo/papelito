name: Cloudflare staging

on:
  push:
    branches:
      - codex/cloudflare-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'kennethgeo/papelito' && github.ref_name == 'codex/cloudflare-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: 2740f49f030ac787611fd720a5ab682a
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_APP_URL: https://papelitocr.papelitocr.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build:vinext

      - name: Deploy private staging Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy:vinext

      - name: Explain missing deployment token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo 'Build passed; deployment skipped until CLOUDFLARE_API_TOKEN is set as a GitHub Actions secret.' >> "$GITHUB_STEP_SUMMARY"
