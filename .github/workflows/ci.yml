name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, Lint, Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Draw algorithm unit tests
        run: npm run test:draw

      - name: Backend integration tests (PGlite PostgreSQL)
        run: npm run test:backend

      - name: Calendar and connection tests
        run: npm run test:ux

      - name: Public-only PWA caching and update lifecycle
        run: npm run test:pwa

      - name: Four-person repository journey and snapshot privacy
        run: npm run test:journey

      - name: Private messages, tastes, history and push delivery
        run: npm run test:social

      - name: Production build (without external secrets)
        run: npm run build

      - name: Lifecycle, deletion and retention integration tests
        run: npm run test:lifecycle

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser regression
        run: npm run test:e2e

      - name: Keep browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
